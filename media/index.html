<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOKULTURA — Media & Articles</title>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-overlay"></div>

    <!-- GŁÓWNY NAGŁÓWEK -->
    <header class="site-header glassmorphism animate-entry delay-1">
        <a href="/" class="brand">SPOKULTURA</a>
        <nav class="main-navigation">
            <a href="/">GŁÓWNA</a>
            <a href="/media" class="active">ARTYKUŁY</a>
            <a href="#">LOOPER</a>
            <a href="#">WIĘCEJ INFO</a>
        </nav>
    </header>

    <!-- KONTENER GŁÓWNY SUBSTRONY -->
    <div class="media-container">

        <!-- SEKCJA HERO / TYTUŁ -->
        <section class="media-heading">
            <h1 class="media-title animate-entry delay-2"><span>MEDIA & ARTICLES</span></h1>
            <p class="media-introduction animate-entry delay-3">Najnowsze wpisy, fotorelacje oraz ekskluzywne materiały wideo.</p>
        </section>

        <!-- PASEK WYSZUKIWANIA I FILTRÓW -->
        <div class="media-toolbar glassmorphism animate-entry delay-4">
            <div class="media-search">
                <input type="text" id="searchInput" placeholder="Szukaj artykułu...">
            </div>

            <div class="filter-buttons">
                <button class="filter-button active" data-filter="all">WSZYSTKIE</button>
                <button class="filter-button" data-filter="photo">ZDJĘCIA</button>
                <button class="filter-button" data-filter="video">WIDEO</button>
            </div>

            <div class="media-sort">
                <select id="sortSelect">
                    <option value="date-desc">Najnowsze</option>
                    <option value="date-asc">Najstarsze</option>
                    <option value="rating-desc">Najwyżej oceniane</option>
                    <option value="rating-asc">Najniżej oceniane</option>
                </select>
            </div>
        </div>

        <!-- PUSTY STAN (Gdy brak wyników wyszukiwania) -->
        <div id="emptyState" class="empty-state" hidden>
            <p>Brak materiałów spełniających kryteria wyszukiwania.</p>
        </div>

        <!-- SIATKA Z KAFELKAMI -->
        <main id="mediaGrid" class="media-grid animate-entry delay-5">
            <!-- Kafelki są generowane automatycznie przez script.js -->
        </main>

    </div>

    <!-- KONTENER NA POWIADOMIENIA TOAST -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- MODAL / OKNO WPISU -->
    <div id="mediaModal" class="modal modal-overlay">
        <div class="modal-content modal-container">
            <span id="modalClose" class="modal-close">&times;</span>

            <!-- Kontener na dynamicznie ładowane media/galerię -->
            <div id="modalMediaContainer" class="modal-media-container"></div>

            <div class="modal-info-section modal-body">
                <div class="modal-header-actions">
                    <h2 id="modalTitle" class="modal-title"></h2>
                    <button id="shareBtn" class="share-btn">🔗 Udostępnij</button>
                </div>
                <h3 id="modalSubtitle" class="modal-subtitle"></h3>
                <p id="modalText" class="modal-text"></p>

                <!-- SEKCJA OCEN -->
                <div class="rating-box">
                    <div id="modalStars" class="stars"></div>
                    <span id="modalRatingNum" class="rating-number">0.0 / 5</span>
                    <span id="modalVotesCount" class="rating-info">(0 głosów)</span>
                    <span id="modalViewsCount" class="views-info">👁️ 0 wyświetleń</span>
                </div>

                <!-- SEKCJA KOMENTARZY -->
                <div class="comments-section">
                    <h3>Komentarze</h3>
                    <div id="commentsList" class="comments-list"></div>

                    <form id="commentForm" class="comment-form">
                        <div id="commentError" class="comment-error" style="display: none;"></div>
                        <input type="text" id="commentAuthor" class="comment-input" placeholder="Twój nick (opcjonalnie)" maxlength="30">
                        <textarea id="commentText" class="comment-textarea" placeholder="Napisz komentarz..." required maxlength="500"></textarea>
                        
                        <!-- Turnstile Widget -->
                        <div class="cf-turnstile" data-sitekey="0x4AAAAAAEP7TChncHbsIA0q"></div>

                        <button type="submit" class="comment-submit-btn">Dodaj komentarz</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- SKRYPTY KONFIGURACYJNE I GŁÓWNE -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
