<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOKULTURA | Portal Media & Blog</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Base CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Cloudflare Turnstile SDK -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

    <div class="page-overlay"></div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- HEADER -->
    <header class="site-header glassmorphism">
        <a href="https://spokultura.pl" class="brand">SPOKULTURA</a>
        <nav class="main-navigation">
            <a href="#" class="active">Główna</a>
            <a href="#">Artykuły</a>
            <a href="https://spokultura.pl/looper">Looper</a>
            <a href="https://spokultura.pl/info">Więcej info</a>
        </nav>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="media-container">

        <header class="media-heading">
            <h1 class="media-title">
                <span>MEDIA & ARTICLES</span>
            </h1>
            <p class="media-introduction">Najnowsze wpisy, fotorelacje oraz ekskluzywne materiały wideo.</p>
        </header>

        <!-- TOOLBAR -->
        <section class="media-toolbar glassmorphism">
            <div class="media-search">
                <input type="text" id="searchInput" placeholder="Szukaj artykułu..." autocomplete="off">
            </div>

            <div class="media-filters">
                <button class="filter-button active" data-filter="all">WSZYSTKIE</button>
                <button class="filter-button" data-filter="photo">ZDJĘCIA</button>
                <button class="filter-button" data-filter="video">WIDEO</button>
            </div>

            <div class="media-sort">
                <label for="sortSelect">SORTUJ:</label>
                <select id="sortSelect">
                    <option value="date-desc">Najnowsze</option>
                    <option value="date-asc">Najstarsze</option>
                    <option value="rating-desc">Najwyżej oceniane</option>
                    <option value="rating-asc">Najniżej oceniane</option>
                </select>
            </div>
        </section>

        <!-- MEDIA LIST GRID -->
        <div id="mediaGrid" class="media-list">
            <!-- Dynamiczne kafelki -->
        </div>

        <div id="emptyState" class="empty-state" hidden>
            <p>Brak materiałów w wybranej kategorii lub wyszukiwaniu.</p>
        </div>

    </main>

    <!-- MODAL / ARTYKUŁ POP-UP -->
    <div id="mediaModal" class="modal-overlay">
        <div class="modal-container">
            <button id="modalClose" class="modal-close" type="button">&times;</button>
            
            <img id="modalImg" class="modal-hero-img" src="" alt="Cover">
            
            <div class="modal-body">
                <div class="modal-header-actions">
                    <h2 id="modalTitle" class="modal-title"></h2>
                    <button id="shareBtn" class="share-btn" title="Udostępnij">
                        🔗 UDOSTĘPNIJ
                    </button>
                </div>

                <h3 id="modalSubtitle" class="modal-subtitle"></h3>
                
                <div class="rating-box" style="margin-bottom: 20px;">
                    <span id="modalStars" class="stars"></span>
                    <span id="modalRatingNum" class="rating-number"></span>
                    <span id="modalVotesCount" class="rating-info"></span>
                    <span id="modalViewsCount" class="views-info">👁️ 0 wyświetleń</span>
                </div>

                <p id="modalText" class="modal-text"></p>

                <!-- SEKCJA KOMENTARZY -->
                <section class="comments-section">
                    <h3>Komentarze</h3>
                    
                    <form id="commentForm" class="comment-form">
                        <input type="text" id="commentAuthor" class="comment-input" placeholder="Twój podpis / Nick" required maxlength="30">
                        <textarea id="commentText" class="comment-textarea" rows="3" placeholder="Dodaj swój komentarz..." required maxlength="500"></textarea>
                        
                        <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="dark"></div>
                        
                        <p id="commentError" style="color: #ff4444; font-size: 0.8rem; display: none;"></p>
                        <button type="submit" class="comment-submit-btn">DODAJ KOMENTARZ</button>
                    </form>

                    <div id="commentsList" class="comments-list">
                        <!-- Komentarze ładowane dynamicznie -->
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- SCRIPT DATA & APP LOGIC -->
    <script src="config.js"></script>
    <script src="script.js"></script>

</body>
</html>
